name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发布前校验（不通过就不部署）
        run: python3 scripts/check_html.py index.html

      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          echo "发布内容："
          ls -la _site

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传发布产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
